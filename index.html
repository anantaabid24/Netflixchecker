
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Elite - Netflix Cookie Validator</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(15, 15, 15, 0.85);
            --accent: #E50914;
            --green: #00FF88;
        }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Syne', sans-serif; 
        }
        .glass { 
            background: var(--panel); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.08); 
        }
        .neon-green { text-shadow: 0 0 15px var(--green); }
    </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <i class="fas fa-waveform text-4xl text-red-500"></i>
        <div>
          <h1 class="text-4xl font-bold tracking-tighter">ANANTA ELITE</h1>
          <p class="text-xs text-gray-400">NETFLIX COOKIE VALIDATOR</p>
        </div>
      </div>
      <div class="text-emerald-400 text-sm flex items-center gap-2">
        <div class="w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></div>
        SYSTEM ONLINE
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Sidebar -->
      <div class="lg:col-span-3 glass rounded-3xl p-8 h-fit">
        <div class="text-center mb-10 border-b border-gray-800 pb-8">
          <h2 class="text-2xl font-bold">Powered By</h2>
          <h1 class="text-5xl font-black text-red-500 tracking-tighter">ANANTA</h1>
        </div>
        
        <div class="space-y-3">
          <div class="nav-item flex items-center gap-4 p-4 rounded-2xl hover:bg-white/5 cursor-pointer">
            <span class="text-2xl">🛫</span>
            <span>Telegram Channel</span>
          </div>
          <div class="nav-item flex items-center gap-4 p-4 rounded-2xl hover:bg-white/5 cursor-pointer">
            <span class="text-2xl">🌐</span>
            <span>Proxy Settings</span>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="lg:col-span-9 space-y-6">
        <!-- Stats -->
        <div class="grid grid-cols-3 gap-6">
          <div class="glass rounded-3xl p-6">
            <p class="text-gray-400 text-sm">TOTAL QUEUE</p>
            <p id="total" class="text-5xl font-bold mt-2">0</p>
          </div>
          <div class="glass rounded-3xl p-6 border border-emerald-500/30">
            <p class="text-emerald-400 text-sm">LIVE HITS</p>
            <p id="live" class="text-5xl font-bold mt-2 text-emerald-400">0</p>
          </div>
          <div class="glass rounded-3xl p-6 border border-red-500/30">
            <p class="text-red-500 text-sm">DEAD FILES</p>
            <p id="dead" class="text-5xl font-bold mt-2 text-red-500">0</p>
          </div>
        </div>

        <!-- Input & Controls -->
        <div class="glass rounded-3xl p-8">
          <textarea id="cookieInput" rows="8" 
            class="w-full bg-black/50 border border-gray-700 rounded-2xl p-6 font-mono text-sm focus:outline-none focus:border-red-500 resize-none"
            placeholder="Paste your Netflix cookies here (Netscape format or key=value)..."></textarea>

          <div class="flex gap-4 mt-6">
            <button onclick="startChecking()" 
              class="flex-1 bg-red-600 hover:bg-red-700 py-5 rounded-2xl font-bold text-lg flex items-center justify-center gap-3">
              <i class="fas fa-play"></i> START CHECKING
            </button>
            <button onclick="clearAll()" 
              class="px-10 bg-gray-800 hover:bg-gray-700 py-5 rounded-2xl font-bold">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>

        <!-- Results Table -->
        <div class="glass rounded-3xl overflow-hidden">
          <table class="w-full">
            <thead class="bg-black/60">
              <tr>
                <th class="p-5 text-left">File / Session</th>
                <th class="p-5 text-center">Status</th>
                <th class="p-5 text-left">Account Info</th>
              </tr>
            </thead>
            <tbody id="results" class="text-sm divide-y divide-gray-800"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let liveCount = 0, deadCount = 0;

    async function checkCookie(content, filename = "Session") {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="p-5 font-mono text-xs">${filename}</td>
        <td class="p-5 text-center"><span class="px-6 py-2 rounded-full bg-yellow-500/20 text-yellow-400 text-xs font-bold">CHECKING...</span></td>
        <td class="p-5 text-gray-400">Validating...</td>
      `;
      document.getElementById('results').appendChild(row);

      try {
        // Parse cookies
        const cookies = {};
        content.split('\n').forEach(line => {
          line = line.trim();
          if (line && !line.startsWith('#') && line.includes('=')) {
            const [key, ...value] = line.split('=');
            if (key) cookies[key.trim()] = value.join('=').trim();
          }
        });

        // Real check
        const res = await fetch('https://www.netflix.com/browse', {
          method: 'GET',
          headers: { 'User-Agent': 'Mozilla/5.0' },
          credentials: 'include'
        });

        const isLive = res.url.includes('/browse') && !res.url.includes('login') && res.status === 200;

        const statusHTML = isLive ? 
          `<span class="px-6 py-2 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-bold">ALIVE</span>` : 
          `<span class="px-6 py-2 rounded-full bg-red-500/20 text-red-500 text-xs font-bold">DEAD</span>`;

        row.innerHTML = `
          <td class="p-5 font-mono text-xs">${filename}</td>
          <td class="p-5 text-center">${statusHTML}</td>
          <td class="p-5 ${isLive ? 'text-emerald-400' : 'text-red-400'}">
            ${isLive ? 'Valid Premium Session' : 'Expired / Invalid'}
          </td>
        `;

        if (isLive) liveCount++;
        else deadCount++;

        document.getElementById('live').textContent = liveCount;
        document.getElementById('dead').textContent = deadCount;

      } catch (e) {
        row.innerHTML = `
          <td class="p-5 font-mono text-xs">${filename}</td>
          <td class="p-5 text-center"><span class="px-6 py-2 rounded-full bg-red-500/20 text-red-400 text-xs font-bold">ERROR</span></td>
          <td class="p-5 text-red-400">Request Failed</td>
        `;
        deadCount++;
        document.getElementById('dead').textContent = deadCount;
      }
    }

    function startChecking() {
      const input = document.getElementById('cookieInput').value.trim();
      if (!input) {
        alert("Please paste cookies first!");
        return;
      }
      checkCookie(input, "Manual_Input");
    }

    function clearAll() {
      if (confirm("Clear all results?")) {
        document.getElementById('results').innerHTML = '';
        liveCount = deadCount = 0;
        document.getElementById('live').textContent = '0';
        document.getElementById('dead').textContent = '0';
      }
    }
  </script>
</body>
</html>
