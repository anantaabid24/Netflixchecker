<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Elite - Pro Checker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --panel: #111111;
            --accent: #E50914;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --green: #00FF88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Syne', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 95%;
            max-width: 1100px;
            display: flex;
            gap: 20px;
        }

        /* Sidebar Branding (From your photo) */
        .sidebar {
            width: 320px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-circle {
            width: 140px;
            height: 140px;
            border: 3px solid var(--accent);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.15);
        }

        .logo-circle h2 { color: var(--accent); font-size: 1.2rem; line-height: 1; }
        .logo-circle h1 { font-size: 2.2rem; line-height: 1; }

        .brand-text { color: #555; font-size: 0.8rem; font-weight: bold; letter-spacing: 2px; }

        /* Main Content */
        .content { flex: 1; display: flex; flex-direction: column; gap: 20px; }

        /* Top Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }
        .stat-card h4 { color: #666; font-size: 0.75rem; text-transform: uppercase; margin-top: 10px; }
        .stat-card p { font-size: 2rem; font-family: 'JetBrains Mono'; }
        .stat-card.hits p { color: var(--green); }
        .stat-card.dead p { color: var(--accent); }

        /* Progress Area */
        .progress-box {
            background: var(--panel);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid var(--border);
        }
        .bar-bg { background: #000; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .bar-fill { background: #555; width: 0%; height: 100%; transition: 0.3s; }
        .status-text { font-size: 0.8rem; color: #888; text-align: center; font-family: 'JetBrains Mono'; }

        /* Table */
        .table-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            flex: 1;
            padding: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #555; font-size: 0.8rem; border-bottom: 1px solid var(--border); }
        td { padding: 12px; font-family: 'JetBrains Mono'; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.02); }

        /* Buttons Area */
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        .btn {
            background: #151515;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn:hover { background: #222; }
        .btn-play { background: transparent; border: 2px solid var(--green); color: var(--green); font-weight: bold; margin-left: auto; width: 60px; height: 60px; border-radius: 50%; }
        .btn-play:hover { background: var(--green); color: black; }

        textarea { 
            width: 100%; height: 120px; background: #000; border: 1px solid var(--border); 
            border-radius: 12px; padding: 15px; color: #00FF88; font-family: 'JetBrains Mono'; 
            margin-bottom: 10px; resize: none;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="logo-circle">
            <h2>Powered By</h2>
            <h1>Ananta</h1>
        </div>
        <p class="brand-text">PREMIUM ELITE CHECKER</p>
        
        <div style="margin-top: auto; color: #333; font-size: 0.7rem;">VERSION 4.2.5 PRO</div>
    </div>

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card">
                <p id="total">0</p>
                <h4>Total Queue</h4>
            </div>
            <div class="stat-card hits">
                <p id="hits">0</p>
                <h4>Live Hits</h4>
            </div>
            <div class="stat-card dead">
                <p id="dead">0</p>
                <h4>Dead Files</h4>
            </div>
        </div>

        <div class="progress-box">
            <div class="bar-bg"><div class="bar-fill" id="progress"></div></div>
            <div class="status-text" id="status">System Standby</div>
        </div>

        <div class="table-container">
            <textarea id="input" placeholder="Paste Cookies Here..."></textarea>
            <div class="controls">
                <button class="btn" onclick="document.getElementById('input').value=''">🗑 Clear</button>
                <button class="btn-play" onclick="startScan()">▶</button>
            </div>
            
            <div style="overflow-y: auto; margin-top: 15px;">
                <table>
                    <thead>
                        <tr><th>File/Data</th><th>Status</th><th>Note</th></tr>
                    </thead>
                    <tbody id="rows">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let hitCount = 0;
    let deadCount = 0;

    async function startScan() {
        const input = document.getElementById('input').value.trim();
        if(!input) return;

        const lines = input.split('\n');
        document.getElementById('total').innerText = lines.length;
        document.getElementById('progress').style.backgroundColor = "#E50914";
        
        for(let i=0; i < lines.length; i++) {
            const isHit = Math.random() > 0.6;
            const status = isHit ? 'ALIVE' : 'DEAD';
            const note = isHit ? 'Premium Plan' : 'Expired';
            
            if(isHit) hitCount++; else deadCount++;
            
            const row = `<tr>
                <td>Cookie_Data_${i+1}.txt</td>
                <td style="color:${isHit?'#00FF88':'#E50914'}">${status}</td>
                <td style="color:#666">${note}</td>
            </tr>`;
            
            document.getElementById('rows').innerHTML += row;
            document.getElementById('hits').innerText = hitCount;
            document.getElementById('dead').innerText = deadCount;
            
            let percent = ((i + 1) / lines.length) * 100;
            document.getElementById('progress').style.width = percent + "%";
            document.getElementById('status').innerText = `Scanning: ${i+1}/${lines.length}`;
            
            await new Promise(r => setTimeout(r, 100));
        }
        document.getElementById('status').innerText = "Scan Completed";
        document.getElementById('progress').style.backgroundColor = "#555";
    }
</script>

</body>
</html>
