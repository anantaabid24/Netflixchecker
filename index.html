<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Elite | Master Node Validator</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020202;
            --surface: rgba(12, 12, 12, 0.85);
            --red: #E50914;
            --red-glow: rgba(229, 9, 20, 0.3);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.2);
            --border: rgba(255, 255, 255, 0.06);
            --text-dim: #777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg); color: white; font-family: 'Syne', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 0%, #1a0505 0%, transparent 50%);
            overflow: hidden;
        }

        .container { width: 95%; max-width: 1400px; height: 85vh; display: flex; gap: 30px; z-index: 2; }

        /* Sidebar */
        .sidebar {
            width: 380px; background: var(--surface); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 30px; padding: 40px;
            display: flex; flex-direction: column; box-shadow: 0 20px 80px rgba(0,0,0,0.9);
        }
        
        .brand {
            text-align: center; padding: 30px 20px; border-radius: 20px;
            background: linear-gradient(180deg, rgba(229,9,20,0.05) 0%, transparent 100%);
            border: 1px solid var(--border); margin-bottom: 40px;
            position: relative; overflow: hidden;
        }
        .brand::before { content:''; position:absolute; top:0; left:20%; width:60%; height:2px; background:var(--red); box-shadow: 0 0 15px var(--red); }
        .brand h2 { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 6px; }
        .brand h1 { font-size: 3.5rem; letter-spacing: -2px; text-shadow: 0 0 30px var(--red-glow); margin-top: 5px; }

        .stat-block { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stat-block .label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-block .value { font-family: 'JetBrains Mono'; font-size: 2.5rem; }
        .val-live { color: var(--green); text-shadow: 0 0 15px var(--green-glow); }
        .val-dead { color: var(--red); text-shadow: 0 0 15px var(--red-glow); }

        /* Main Console */
        .console {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            border-radius: 30px; padding: 30px; display: flex; flex-direction: column;
            backdrop-filter: blur(30px); position: relative;
        }

        .input-area { position: relative; margin-bottom: 25px; }
        textarea {
            width: 100%; height: 180px; background: #050505; border: 1px solid var(--border);
            border-radius: 20px; padding: 25px; color: var(--green); font-family: 'JetBrains Mono';
            font-size: 0.9rem; resize: none; outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--red); box-shadow: inset 0 0 20px rgba(229,9,20,0.1); }

        .control-panel { display: flex; align-items: center; gap: 25px; background: #050505; padding: 20px 30px; border-radius: 20px; border: 1px solid var(--border); }
        .sys-status { flex: 1; }
        .sys-status p { color: var(--text-dim); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 8px; }
        .progress-track { width: 100%; height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--red); transition: 0.3s; box-shadow: 0 0 10px var(--red); }

        .btn-launch {
            background: transparent; border: 2px solid var(--green); color: var(--green);
            width: 70px; height: 70px; border-radius: 50%; font-size: 1.5rem;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: 0.4s; box-shadow: 0 0 20px var(--green-glow);
        }
        .btn-launch:hover { background: var(--green); color: black; transform: scale(1.1); box-shadow: 0 0 40px var(--green); }
        .btn-launch:disabled { border-color: var(--text-dim); color: var(--text-dim); box-shadow: none; cursor: not-allowed; transform: none; background: transparent; }

        /* Data Grid */
        .grid-container { flex: 1; overflow-y: auto; margin-top: 20px; padding-right: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { text-align: left; padding: 0 20px; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; font-family: 'JetBrains Mono'; }
        td { padding: 18px 20px; background: rgba(255,255,255,0.02); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono'; font-size: 0.85rem; }
        td:first-child { border-left: 1px solid var(--border); border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        td:last-child { border-right: 1px solid var(--border); border-top-right-radius: 12px; border-bottom-right-radius: 12px; text-align: right; }

        .tag { padding: 6px 14px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; }
        .tag-live { background: rgba(0,255,136,0.1); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }
        .tag-dead { background: rgba(229,9,20,0.1); color: var(--red); border: 1px solid rgba(229,9,20,0.3); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="brand">
            <h2>Powered By</h2>
            <h1>ANANTA</h1>
        </div>

        <div class="stat-block">
            <span class="label">Total Queue</span>
            <span class="value" id="val-total" style="color:white">0</span>
        </div>
        <div class="stat-block">
            <span class="label">Live Hits</span>
            <span class="value val-live" id="val-live">0</span>
        </div>
        <div class="stat-block">
            <span class="label">Dead Assets</span>
            <span class="value val-dead" id="val-dead">0</span>
        </div>
        
        <div style="margin-top: auto; text-align: center; color: #444; font-size: 0.7rem; font-family: 'JetBrains Mono';">
            SERVER: DISCONNECTED
        </div>
    </div>

    <div class="console">
        <div class="input-area">
            <textarea id="cookie-data" placeholder="[ ENTER COOKIE DATA (JSON OR NETSCAPE) HERE ]"></textarea>
        </div>

        <div class="control-panel">
            <div class="sys-status">
                <p id="status-text">AWAITING INPUT...</p>
                <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
            </div>
            <button class="btn-launch" id="btn-start" onclick="initiateScan()">▶</button>
        </div>

        <div class="grid-container">
            <table>
                <thead><tr><th>Asset ID</th><th>Session State</th><th>Server Response</th></tr></thead>
                <tbody id="log-table"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let hitCount = 0, deadCount = 0;

    // Format parser ensures the backend receives clean data
    function formatForBackend(raw) {
        raw = raw.trim();
        if (raw.startsWith('[') && raw.endsWith(']')) {
            try {
                const j = JSON.parse(raw);
                return j.map(c => `${c.name}=${c.value}`).join('; ');
            } catch(e) { return null; }
        }
        if (raw.includes('\t')) {
            return raw.split('\n').filter(l => l.trim() && !l.startsWith('#'))
                .map(l => {
                    const p = l.split('\t');
                    return p.length >= 7 ? `${p[5].trim()}=${p[6].trim()}` : null;
                }).filter(x => x).join('; ');
        }
        return raw; 
    }

    async function checkCookieWithBackend(cookieString) {
        // --- IMPORTANT ---
        // This is pointing to your custom backend server.
        // Replace this URL with your actual hosted Node.js backend URL.
        const API_URL = "http://localhost:3000/api/check-netflix"; 

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cookie: cookieString })
            });
            const data = await response.json();
            return data.isLive; 
        } catch (error) {
            console.error("Backend unreachable", error);
            return false; // Assumes dead if backend fails
        }
    }

    async function initiateScan() {
        const input = document.getElementById('cookie-data').value.trim();
        if(!input) return alert("NO DATA DETECTED.");

        const blocks = input.split(/\n\s*\n/).filter(b => b.trim().length > 10);
        document.getElementById('val-total').innerText = blocks.length;
        
        const btn = document.getElementById('btn-start');
        btn.disabled = true;
        document.getElementById('status-text').innerText = "COMMUNICATING WITH BACKEND SERVER...";

        for(let i=0; i < blocks.length; i++) {
            const formattedCookie = formatForBackend(blocks[i]);
            if(!formattedCookie) continue;

            // Calls your actual backend to do the heavy lifting
            const isLive = await checkCookieWithBackend(formattedCookie);
            
            if(isLive) hitCount++; else deadCount++;

            const tr = `<tr>
                <td>ASSET_${Math.random().toString(36).substring(2, 8).toUpperCase()}</td>
                <td><span class="tag ${isLive?'tag-live':'tag-dead'}">${isLive?'VALID':'EXPIRED'}</span></td>
                <td style="color:#666">${isLive ? 'Active Session' : 'Login Required / Blocked'}</td>
            </tr>`;

            document.getElementById('log-table').insertAdjacentHTML('afterbegin', tr);
            document.getElementById('val-live').innerText = hitCount;
            document.getElementById('val-dead').innerText = deadCount;
            document.getElementById('progress-bar').style.width = ((i+1)/blocks.length)*100 + "%";
        }
        
        document.getElementById('status-text').innerText = "SCAN COMPLETE.";
        btn.disabled = false;
    }
</script>

</body>
</html>
